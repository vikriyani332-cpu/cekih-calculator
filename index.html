<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Score Cekih - Pencatat Poin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Score Cekih">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <!-- Layar Muat -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <h1>Score Cekih</h1>
            <div class="loading-bar">
                <div id="loadingBar" class="loading-progress"></div>
            </div>
            <p>Memuat permainan...</p>
        </div>
    </div>

    <!-- Halaman Pengaturan Awal -->
    <div id="setupPage" class="page">
        <div class="container">
            <header class="header">
                <h1>⚙️ Pengaturan Permainan</h1>
            </header>

            <div class="card">
                <h3>✍️ Nama Pemain</h3>
                <div class="input-group">
                    <label for="namaA">Pemain 1</label>
                    <input type="text" id="namaA" class="input-text" placeholder="Masukkan nama" value="Pemain A">
                </div>
                <div class="input-group">
                    <label for="namaB">Pemain 2</label>
                    <input type="text" id="namaB" class="input-text" placeholder="Masukkan nama" value="Pemain B">
                </div>
                <div class="input-group">
                    <label for="namaC">Pemain 3</label>
                    <input type="text" id="namaC" class="input-text" placeholder="Masukkan nama" value="Pemain C">
                </div>
                <div class="input-group">
                    <label for="namaD">Pemain 4</label>
                    <input type="text" id="namaD" class="input-text" placeholder="Masukkan nama" value="Pemain D">
                </div>
            </div>

            <div class="card">
                <h3>🎯 Target Kemenangan</h3>
                <div class="input-group">
                    <label for="targetMenang">Mencapai skor berapa untuk menang?</label>
                    <input type="number" id="targetMenang" class="input-text" placeholder="Contoh: 1000" value="1000" min="100" max="9999">
                </div>
            </div>

            <button id="btnMulaiPermainan" class="btn btn-primary btn-lg">✅ Mulai Permainan</button>
        </div>
    </div>

    <!-- Halaman Utama Permainan -->
    <div id="gamePage" class="page">
        <div class="container">
            <!-- Header Atas -->
            <header class="header">
                <div class="header-info">
                    <span>Ronde: <strong id="rondeInfo">1</strong></span>
                    <span>Putaran: <strong id="puteranInfo">0</strong></span>
                    <span>Target: <strong id="targetInfo">1000</strong></span>
                </div>
                <div class="header-actions">
                    <button id="btnTheme" class="btn btn-icon" title="Ganti Tema">☀️</button>
                    <button id="btnFullscreen" class="btn btn-icon" title="Layar Penuh">⛶</button>
                    <button id="btnScreenshot" class="btn btn-icon" title="Ambil Gambar">📸</button>
                    <button id="btnUndo" class="btn btn-icon" title="Batalkan Langkah Terakhir">↩️</button>
                    <button id="btnResetGame" class="btn btn-icon btn-danger" title="Reset Permainan">🗑️</button>
                </div>
            </header>

            <!-- Kartu Pemain -->
            <div id="pemainContainer" class="players-grid"></div>

            <!-- Kolom Masukkan Poin -->
            <div class="card input-score-section">
                <h3>➕ Masukkan Poin Per Putaran</h3>
                <div class="inputs-grid">
                    <!-- ✅ BAGIAN INI SAJA YANG DIPERBAIKI, YANG LAIN SAMA -->
                    <div class="input-group">
                        <label id="labelSkorA" for="skorA">Pemain A</label>
                        <input type="number" id="skorA" class="input-point" placeholder="0" min="-1000" max="1000">
                    </div>
                    <div class="input-group">
                        <label id="labelSkorB" for="skorB">Pemain B</label>
                        <input type="number" id="skorB" class="input-point" placeholder="0" min="-1000" max="1000">
                    </div>
                    <div class="input-group">
                        <label id="labelSkorC" for="skorC">Pemain C</label>
                        <input type="number" id="skorC" class="input-point" placeholder="0" min="-1000" max="1000">
                    </div>
                    <div class="input-group">
                        <label id="labelSkorD" for="skorD">Pemain D</label>
                        <input type="number" id="skorD" class="input-point" placeholder="0" min="-1000" max="1000">
                    </div>
                </div>
                <button id="btnSimpanPuteran" class="btn btn-primary btn-lg btn-block">💾 Simpan & Hitung</button>
            </div>

            <!-- Tab Menu -->
            <div class="tabs-container">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="ranking">📊 Peringkat</button>
                    <button class="tab-btn" data-tab="riwayat">📜 Riwayat</button>
                    <button class="tab-btn" data-tab="statistik">📈 Statistik</button>
                    <button class="tab-btn" data-tab="pencapaian">🏆 Pencapaian</button>
                    <button class="tab-btn" data-tab="arsip">🗄️ Arsip</button>
                </div>

                <div class="tabs-content">
                    <div id="tabRanking" class="tab-page active">
                        <div id="rankingList" class="list-container"></div>
                    </div>
                    <div id="tabRiwayat" class="tab-page">
                        <div id="historyList" class="list-container"></div>
                    </div>
                    <div id="tabStatistik" class="tab-page">
                        <div id="statistikList" class="list-container"></div>
                    </div>
                    <div id="tabPencapaian" class="tab-page">
                        <div id="achievementList" class="list-container"></div>
                    </div>
                    <div id="tabArsip" class="tab-page">
                        <div id="arsipList" class="list-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Notifikasi -->
    <div id="popupOverlay" class="popup-overlay">
        <div id="popupBox" class="popup-box">
            <div id="popupContent" class="popup-content"></div>
            <div class="popup-actions">
                <button id="popupBtn1" class="btn btn-secondary">❌ Batal</button>
                <button id="popupBtn2" class="btn btn-primary">✅ Oke</button>
            </div>
        </div>
    </div>

    <!-- Kanvas Animasi -->
    <canvas id="fireCanvas" class="effect-canvas"></canvas>
    <canvas id="starCanvas" class="effect-canvas"></canvas>

    <!-- Berkas Suara -->
    <audio id="audioNol" preload="auto" src="dimulaidari.wav">
    <audio id="audioGod" preload="auto" src="suaradewa.wav">
    <audio id="audioBakar" preload="auto" src="suarabakar.wav">

    <!-- Berkas Skrip -->
    <script src="app.js"></script>
</body>
</html>
