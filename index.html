<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Cekih by Sadewa Corp</title>
    <meta name="description" content="Aplikasi Penghitung Skor Premium">
    <meta name="theme-color" content="#1a1410">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="classic-192.png">
    <link rel="apple-touch-icon" href="classic-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen active">
        <div class="loading-content">
            <img src="classic-512.png" alt="Logo Score Cekih" class="logo-loading">
            <h2 class="app-title">Score Cekih</h2>
            <p class="app-subtitle">by Sadewa Corp</p>
            <div class="loading-bar-container">
                <div id="loadingBar" class="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <img src="classic-192.png" alt="Logo" class="logo-mini">
            <h1>Score Cekih</h1>
        </div>
        <div class="header-right">
            <button id="btnFullscreen" class="icon-btn" title="Layar Penuh">⛶</button>
            <button id="btnScreenshot" class="icon-btn" title="Ambil Gambar">📸</button>
            <button id="btnTheme" class="icon-btn" title="Ganti Tema">☀️</button>
        </div>
    </header>

    <!-- Info Permainan -->
    <section class="game-info">
        <div class="info-card">
            <span>RONDE: <span id="rondeInfo">1</span></span>
        </div>
        <div class="info-card">
            <span>PUTERAN: <span id="puteranInfo">0</span></span>
        </div>
        <div class="info-card">
            <span>TARGET: <span id="targetInfo">1000</span></span>
        </div>
        <button id="btnUndo" class="btn-undo" title="Batalkan Langkah Terakhir">↩️ UNDO</button>
    </section>

    <!-- Halaman Setup Awal -->
    <div id="setupPage" class="page active">
        <div class="page-content">
            <h2 class="section-title">Pengaturan Permainan</h2>
            <div class="form-group">
                <label>Nama Pemain A</label>
                <input type="text" id="namaA" class="input-text" value="Pemain A" maxlength="20">
            </div>
            <div class="form-group">
                <label>Nama Pemain B</label>
                <input type="text" id="namaB" class="input-text" value="Pemain B" maxlength="20">
            </div>
            <div class="form-group">
                <label>Nama Pemain C</label>
                <input type="text" id="namaC" class="input-text" value="Pemain C" maxlength="20">
            </div>
            <div class="form-group">
                <label>Nama Pemain D</label>
                <input type="text" id="namaD" class="input-text" value="Pemain D" maxlength="20">
            </div>
            <div class="form-group">
                <label>Target Kemenangan</label>
                <input type="number" id="targetMenang" class="input-number" value="1000" min="100" max="10000">
            </div>
            <button id="btnMulaiPermainan" class="btn-primary btn-block">MULAI PERMAINAN</button>
        </div>
    </div>

    <!-- Halaman Utama Permainan -->
    <div id="gamePage" class="page">
        <div class="page-content">
            <div id="pemainContainer" class="players-grid"></div>

            <!-- Input Skor Langsung -->
            <div class="input-section">
                <h3 class="section-subtitle">Masukkan Tambahan Skor</h3>
                <div class="score-input-grid">
                    <div class="input-item">
                        <label id="labelA">Pemain A</label>
                        <input type="number" id="skorA" class="input-point" placeholder="±0" min="-1000" max="1000" step="1">
                    </div>
                    <div class="input-item">
                        <label id="labelB">Pemain B</label>
                        <input type="number" id="skorB" class="input-point" placeholder="±0" min="-1000" max="1000" step="1">
                    </div>
                    <div class="input-item">
                        <label id="labelC">Pemain C</label>
                        <input type="number" id="skorC" class="input-point" placeholder="±0" min="-1000" max="1000" step="1">
                    </div>
                    <div class="input-item">
                        <label id="labelD">Pemain D</label>
                        <input type="number" id="skorD" class="input-point" placeholder="±0" min="-1000" max="1000" step="1">
                    </div>
                </div>
                <button id="btnSimpanPuteran" class="btn-success btn-block">SIMPAN PUTERAN</button>
            </div>
        </div>
    </div>

    <!-- Tab Navigasi -->
    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="main">Permainan</button>
        <button class="tab-btn" data-tab="ranking">Ranking</button>
        <button class="tab-btn" data-tab="history">Riwayat</button>
        <button class="tab-btn" data-tab="achievement">Pencapaian</button>
        <button class="tab-btn" data-tab="statistik">Statistik</button>
        <button class="tab-btn" data-tab="arsip">Arsip</button>
    </nav>

    <!-- Halaman Tab -->
    <div id="tabRanking" class="tab-page">
        <h2 class="section-title">Ranking Saat Ini</h2>
        <div id="rankingList" class="list-container"></div>
    </div>

    <div id="tabHistory" class="tab-page">
        <h2 class="section-title">Riwayat Permainan</h2>
        <div id="historyList" class="list-container reverse"></div>
    </div>

    <div id="tabAchievement" class="tab-page">
        <h2 class="section-title">Pencapaian</h2>
        <div id="achievementList" class="achievement-grid"></div>
    </div>

    <div id="tabStatistik" class="tab-page">
        <h2 class="section-title">Statistik Pemain Aktif</h2>
        <div id="statistikList" class="statistik-grid"></div>
    </div>

    <div id="tabArsip" class="tab-page">
        <h2 class="section-title">Arsip Semua Pemain</h2>
        <div id="arsipList" class="list-container"></div>
    </div>

    <!-- Tombol Reset -->
    <button id="btnResetGame" class="btn-reset">🗑️ RESET PERMAINAN</button>

    <!-- Popup Umum -->
    <div id="popupOverlay" class="popup-overlay">
        <div id="popupBox" class="popup-box">
            <div id="popupContent"></div>
            <div class="popup-buttons">
                <button id="popupBtn1" class="btn-secondary">Batal</button>
                <button id="popupBtn2" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Animasi Khusus -->
    <canvas id="fireCanvas" class="animation-canvas"></canvas>
    <canvas id="starCanvas" class="animation-canvas"></canvas>

    <!-- Audio -->
    <audio id="audioGod" src="godofgambler.wav" preload="auto">
    <audio id="audioNol" src="dimulaidari0.wav" preload="auto">

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
