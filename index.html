<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Score Cekih by Sadewa Corp</title>
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Aplikasi Score Card Premium untuk permainan kartu.">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="192x192" href="classic-192.png">
    <link rel="apple-touch-icon" href="classic-192.png">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <img src="classic-512.png" alt="Logo" class="logo-pulse">
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <p>Memuat Sadewa Corp...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="hidden">
        
        <!-- Header -->
        <header>
            <div class="header-top">
                <img src="classic-512.png" alt="Logo" class="header-logo">
                <h1>Score Cekih</h1>
            </div>
            <div class="game-info">
                <span id="ronde-display">RONDE 1</span>
                <span id="putaran-display">PUTERAN 0</span>
                <span id="target-display">TARGET: 1000</span>
            </div>
        </header>

        <!-- Setup Screen (Initial & New Round) -->
        <div id="setup-screen" class="screen active">
            <div class="card setup-card">
                <h2>Pengaturan Ronde</h2>
                <div class="input-group">
                    <label>Nama Pemain A</label>
                    <input type="text" id="p1-name" placeholder="Pemain A" value="Pemain A">
                </div>
                <div class="input-group">
                    <label>Nama Pemain B</label>
                    <input type="text" id="p2-name" placeholder="Pemain B" value="Pemain B">
                </div>
                <div class="input-group">
                    <label>Nama Pemain C</label>
                    <input type="text" id="p3-name" placeholder="Pemain C" value="Pemain C">
                </div>
                <div class="input-group">
                    <label>Nama Pemain D</label>
                    <input type="text" id="p4-name" placeholder="Pemain D" value="Pemain D">
                </div>
                <div class="input-group">
                    <label>Target Kemenangan</label>
                    <select id="target-score">
                        <option value="500">500</option>
                        <option value="750">750</option>
                        <option value="1000" selected>1000</option>
                        <option value="1500">1500</option>
                    </select>
                </div>
                <button id="btn-start-game" class="btn-primary">MULAI PERMAINAN</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            
            <!-- Player Cards Container -->
            <div id="players-container" class="players-grid">
                <!-- Player cards will be injected here by JS -->
            </div>

            <!-- Input Section -->
            <div class="input-section card">
                <h3>Input Skor Puteran Ini</h3>
                <div class="score-inputs">
                    <div class="input-wrapper">
                        <label id="label-p1">A</label>
                        <input type="number" id="input-p1" placeholder="0">
                    </div>
                    <div class="input-wrapper">
                        <label id="label-p2">B</label>
                        <input type="number" id="input-p2" placeholder="0">
                    </div>
                    <div class="input-wrapper">
                        <label id="label-p3">C</label>
                        <input type="number" id="input-p3" placeholder="0">
                    </div>
                    <div class="input-wrapper">
                        <label id="label-p4">D</label>
                        <input type="number" id="input-p4" placeholder="0">
                    </div>
                </div>
                <button id="btn-save-turn" class="btn-primary">SIMPAN PUTERAN</button>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="btn-undo" class="btn-secondary">↩ UNDO</button>
                <button id="btn-screenshot" class="btn-secondary">📸 SCREENSHOT</button>
                <button id="btn-fullscreen" class="btn-secondary">⛶ FULLSCREEN</button>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="ranking">Ranking</button>
                    <button class="tab-btn" data-tab="history">History</button>
                    <button class="tab-btn" data-tab="stats">Statistik</button>
                    <button class="tab-btn" data-tab="archive">Arsip</button>
                </div>
                <div class="tabs-content">
                    <div id="tab-ranking" class="tab-pane active">
                        <ul id="ranking-list"></ul>
                    </div>
                    <div id="tab-history" class="tab-pane">
                        <ul id="history-list"></ul>
                    </div>
                    <div id="tab-stats" class="tab-pane">
                        <div id="stats-content"></div>
                    </div>
                    <div id="tab-archive" class="tab-pane">
                        <ul id="archive-list"></ul>
                    </div>
                </div>
            </div>

            <!-- Reset Button -->
            <button id="btn-reset-game" class="btn-danger">🗑 RESET GAME</button>
        </div>

    </div>

    <!-- Modals -->
    
    <!-- Burn Confirmation Modal -->
    <div id="modal-burn-confirm" class="modal hidden">
        <div class="modal-content">
            <h3>Konfirmasi Bakaran</h3>
            <p>Siapa yang membakar <span id="burn-victim-name" class="highlight"></span>?</p>
            <div id="burn-perpetrator-list" class="modal-options">
                <!-- Options injected by JS -->
            </div>
            <button id="btn-cancel-burn" class="btn-secondary">Batal</button>
        </div>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="modal-reset-confirm" class="modal hidden">
        <div class="modal-content">
            <h3>Reset Permainan?</h3>
            <p>Semua skor, ronde, dan history saat ini akan dihapus. Statistik pemain tetap aman.</p>
            <div class="modal-actions">
                <button id="btn-confirm-reset" class="btn-danger">Ya, Reset</button>
                <button id="btn-cancel-reset" class="btn-secondary">Batal</button>
            </div>
        </div>
    </div>

    <!-- Fire Animation Overlay -->
    <div id="fire-overlay" class="hidden">
        <div class="fire-animation"></div>
    </div>

    <!-- Star Animation Overlay -->
    <div id="star-overlay" class="hidden">
        <div class="star-fall">⭐</div>
    </div>

    <script src="app.js">
